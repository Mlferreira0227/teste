<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
</head>
<body>

    <h1>Nome recebido</h1>
	<p><strong>Nome:</strong> <span id="nome"></span></p>
    <p><strong>Dado A:</strong> <span id="dadoa"></span></p>

    <p id="resultado"></p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nome = params.get("nome");
		const dadoa = params.get("dadoa")

		document.getElementById("nome").textContent = dadoa;
		document.getElementById("dadoa").textContent = dadoa;

        document.getElementById("resultado").textContent =
            "Olá, " + nome + "!";
		
    </script>

</body>
</html>
